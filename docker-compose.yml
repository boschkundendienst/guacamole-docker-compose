networks:
  guacnetwork:
    driver: bridge
  traefik:
    external: true

services:
  guacd:
    container_name: guacd
    image: guacamole/guacd
    networks:
      - guacnetwork
    restart: always
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw

  postgres:
    container_name: guacamole-postgres
    image: postgres:15.2-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/guacamole
      POSTGRES_DB: guacamole_db
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-ChooseYourOwnPasswordHere1234}'
      POSTGRES_USER: '${POSTGRES_USER:-guacamole_user}'
    networks:
      - guacnetwork
    restart: always
    volumes:
      - ./init:/docker-entrypoint-initdb.d:z
      - ./data:/var/lib/postgresql/data:Z

  guacamole:
    container_name: guacamole
    image: guacamole/guacamole
    depends_on:
      - guacd
      - postgres
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-ChooseYourOwnPasswordHere1234}'
      POSTGRES_USER: '${POSTGRES_USER:-guacamole_user}'
    networks:
      - guacnetwork
      - traefik
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.guacamole.rule=Host(`${GUACAMOLE_HOSTNAME}`)"
      - "traefik.http.routers.guacamole.entrypoints=websecure"
      - "traefik.http.routers.guacamole.tls=true"
      - "traefik.http.routers.guacamole.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}"
      - "traefik.http.services.guacamole.loadbalancer.server.port=8080"
      - "traefik.http.routers.guacamole.middlewares=guacamole-addprefix"
      - "traefik.http.middlewares.guacamole-addprefix.addprefix.prefix=/guacamole"
      - "traefik.docker.network=traefik"
